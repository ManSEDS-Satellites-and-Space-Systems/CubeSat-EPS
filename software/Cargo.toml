[package]
name = "libcsp-test"
version = "0.1.0"
edition = "2024"


[dependencies]
# Change stm32f103c8 to your chip name, if necessary.
embassy-stm32 = { version = "0.6.0", features = [ "defmt", "stm32g431kb", "unstable-pac", "memory-x", "time-driver-any" ]  }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-usb = { version = "0.6.0", features = ["defmt"] }
embassy-futures = { version = "0.1.2" }
embassy-embedded-hal = "*"
embassy-sync = "*"
embedded-hal = "1"
embedded-hal-async = "1"

defmt = "1.0.1"
defmt-rtt = "1.0.0"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2.0.0"

ina3221-dd = "0.2"

csp = {git = "https://github.com/YC-Lam/libcsp-rs.git", default-features = false, features = ["embassy", "embassy_stm32", "defmt", "promisc", "rdp", "hmac"]}

[profile.dev]
opt-level = "s"

[profile.release]
debug = 2
opt-level = "s"

[package.metadata.embassy]
build = [
  { target = "thumbv7em-none-eabi", artifact-dir = "out/examples/stm32f1" }
]